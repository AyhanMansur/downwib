<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DownWib — مرجع نرم‌افزار</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#163f5e">
<meta name="description" content="فهرست دستی از نرم‌افزارها و ابزارهایی که واقعاً استفاده می‌کنم.">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--blue:#3b8fc9;--blue-d:#1f5f8f;--blue-dd:#163f5e;--bg:#0e1820;--card:#15222c;--line:#243644;--fg:#dbe5ec;--dim:#8a9ba8;--link:#6bb8ec;--stripe:#192935;--hover:#1e3342;--head:#1b2d3b;--green:#3aa655;--accent:#7ec0ee}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;font-size:.875rem;line-height:1.7;color:var(--fg);background:var(--bg);}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.wrap{max-width:72rem;margin-inline:auto;padding-inline:.75rem}

/* header */
.top{background:linear-gradient(#256d9f,var(--blue-d));border-bottom:3px solid var(--blue-dd);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:5.5rem;flex-wrap:wrap;padding-block:.5rem}
.logo{display:block;color:#fff}
.logo b{display:block;font-size:2.4rem;font-weight:800;line-height:1.1}
.logo small{display:block;font-size:.72rem;color:#d7ecfa;margin-top:.15rem}
.search{display:flex;flex:0 1 22rem;min-width:0;width:100%;max-width:22rem}
.search input{flex:1;min-width:0;min-height:40px;padding:0 .75rem;border:1px solid var(--blue-dd);border-inline-end:0;background:var(--bg);color:var(--fg);border-radius:0 4px 4px 0}
.search input:focus{outline:2px solid #ffd666;outline-offset:-2px}
.search span{display:grid;place-items:center;width:44px;background:var(--blue-dd);color:#fff;border-radius:4px 0 0 4px}

/* nav */
.nav{background:var(--blue-dd);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav ul{list-style:none;display:flex;white-space:nowrap}
.nav button{display:block;min-height:44px;padding:0 1rem;color:#e6f2fb;background:none;border:0;border-inline-start:1px solid rgba(255,255,255,.12);cursor:pointer;font-size:.8125rem}
.nav button:hover{background:var(--blue-d)}
.nav button[aria-current=true]{background:var(--card);color:var(--accent);font-weight:700}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 15rem;gap:.75rem;padding-block:.75rem 1.5rem;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:2}}

.box{background:var(--card);border:1px solid var(--line);border-radius:3px}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--head);border-bottom:2px solid var(--blue);font-weight:700;color:var(--accent)}
.box-h .cnt{font-weight:400;font-size:.75rem;color:var(--dim)}

/* list */
.rows{list-style:none}
.row{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;align-items:center;gap:.6rem;padding:.55rem .75rem;border-bottom:1px solid var(--line)}
.row:nth-child(even){background:var(--stripe)}
.row:hover{background:var(--hover)}
.ic{width:2rem;height:2rem;display:grid;place-items:center;font-size:1.1rem;background:var(--head);border:1px solid var(--line);border-radius:3px}
.tt{min-width:0}
.tt a{display:block;font-weight:700;color:var(--link);overflow-wrap:anywhere}
.tt a:hover{color:#ff8a7a}
.tt small{display:flex;flex-wrap:wrap;gap:.1rem .75rem;font-size:.72rem;color:var(--dim)}
.tt small i{font-style:normal;color:var(--green)}
.dl{min-height:34px;padding:0 .8rem;display:inline-grid;place-items:center;background:var(--green);color:#fff;border-radius:3px;font-size:.78rem;border-bottom:2px solid #2b8a43;white-space:nowrap}
.dl:hover{background:#2f9449}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--dim)}

/* grid test */
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.4rem;padding:.4rem}
.row,.row:nth-child(even){display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2rem;padding:.5rem .35rem;background:var(--stripe);border:1px solid var(--line);border-radius:4px}
.row:hover{background:var(--hover)}
.ic{width:2.2rem;height:2.2rem;font-size:1.2rem;border-radius:5px}
.tt{width:100%}
.tt a{font-size:.78rem;line-height:1.5}.tt small{flex-direction:column;align-items:center;gap:0;font-size:.66rem;line-height:1.5}.tt small span:first-child{display:none}
.dl{width:100%;margin-top:auto;min-height:28px;font-size:.7rem;padding:0 .4rem}
.empty{grid-column:1/-1}
@media(max-width:480px){.rows{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* sidebar */
.side{display:grid;gap:.75rem}
.cats{list-style:none}
.cats button{display:flex;justify-content:space-between;width:100%;min-height:42px;align-items:center;padding:.3rem .75rem;background:none;border:0;border-bottom:1px dashed var(--line);cursor:pointer;color:var(--fg);text-align:start}
.cats button:hover{background:var(--hover);color:var(--link)}
.cats button[aria-current=true]{background:var(--hover);color:var(--accent);font-weight:700}
.cats .n{font-size:.72rem;background:var(--blue);color:#fff;border-radius:9px;padding:0 .5rem;min-width:1.6rem;text-align:center}
.about{padding:.75rem;font-size:.8125rem;color:var(--dim);line-height:1.9}

footer{background:var(--blue-dd);color:#b9d6ec;font-size:.75rem;padding:1rem 0 calc(1rem + env(safe-area-inset-bottom))}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem}
footer a{border-bottom:1px solid rgba(255,255,255,.4)}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="logo" href="#"><b>DownWib</b><small>مرجع دانلود نرم‌افزار، بازی و سیستم‌عامل</small></a>
  <label class="search"><input type="search" id="q" placeholder="جستجوی نرم‌افزار..." aria-label="جستجو"><span aria-hidden="true">🔍</span></label>
</div></header>
<nav class="nav" aria-label="دسته‌ها"><div class="wrap"><ul id="nav"></ul></div></nav>

<main class="wrap layout">
  <section class="box" aria-labelledby="ttl">
    <div class="box-h"><span id="ttl">آخرین نرم‌افزارها</span><span class="cnt" id="cnt"></span></div>
    <ul class="rows" id="rows"></ul>
  </section>
  <aside class="side">
    <div class="box"><div class="box-h">دسته‌بندی</div><ul class="cats" id="cats"></ul></div>
    <div class="box"><div class="box-h">دربارهٔ سایت</div><p class="about">بدون صفحهٔ واسط و تبلیغ. هر لینک به صفحهٔ رسمی سازنده می‌رود.</p></div>
  </aside>
</main>

<footer><div class="wrap">
  <span><b>DownWib</b> · ساخته‌شده توسط <a href="https://github.com/AyhanMansur" target="_blank" rel="noopener">آیهان منصور</a> · ۱۴۰۳–۱۴۰۵</span>
  <span>یک فایل HTML · بدون ردیاب</span>
</div></footer>

['اندروید — بازی','Candy Crush Saga','90 MB','1.285','🍬','https://play.google.com/store/apps/details?id=com.king.candycrushsaga'],
['لینوکس','Ubuntu 24.04 LTS','4.2 GB','24.04','🐧','https://ubuntu.com/download/desktop'],
['لینوکس','Fedora Workstation 41','2.1 GB','41','🐧','https://fedoraproject.org/workstation/download/'],

['لینوکس','Kali Linux','4.0 GB','2025.4','🔒','https://www.kali.org/get-kali/'],
['مرورگر','Google Chrome','90 MB','134.0','🌐','https://www.google.com/chrome/'],
['مرورگر','Mozilla Firefox','58 MB','135.0','🦊','https://www.mozilla.org/firefox/download/'],

['مرورگر','Brave','145 MB','1.76','🦁','https://brave.com/download/'],
['مرورگر','Microsoft Edge','180 MB','134.0','🌊','https://www.microsoft.com/edge/download'],
['چندرسانه‌ای','VLC Media Player','45 MB','3.0.21','🎬','https://www.videolan.org/vlc/'],
['چندرسانه‌ای','Spotify','95 MB','1.2.60','🎵','https://www.spotify.com/download/'],

['چندرسانه‌ای','GIMP','280 MB','2.10.38','🖼️','https://www.gimp.org/downloads/'],
['چندرسانه‌ای','Audacity','45 MB','3.7','🎙️','https://www.audacityteam.org/download/'],
['چندرسانه‌ای','iTunes','230 MB','12.13','🎵','https://www.apple.com/itunes/download/'],
['چندرسانه‌ای','Adobe Premiere Pro 2024','3.8 GB','25.0','🎬','https://www.adobe.com/products/premiere.html'],
['iOS','WhatsApp','170 MB','25.1','💬','https://apps.apple.com/app/whatsapp-messenger/id310633997'],
['iOS','Instagram','260 MB','345.0','📷','https://apps.apple.com/app/instagram/id389801252'],
['iOS','Telegram','210 MB','11.4','✈️','https://apps.apple.com/app/telegram-messenger/id686449807']
].map(function(r){return{category:r[0],title:r[1],size:r[2],version:r[3],icon:r[4],url:r[5]}});

var state={category:ALL,query:''};
var $=function(id){return document.getElementById(id)};
function fa(n){return String(n).replace(/\d/g,function(d){return'۰۱۲۳۴۵۶۷۸۹'[d]})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function countIn(c){return c===ALL?FILES.length:FILES.filter(function(f){return f.category===c}).length}

function renderMenus(){
  var nav=$('nav'),cats=$('cats');nav.innerHTML='';cats.innerHTML='';
  [ALL].concat(CATS).forEach(function(c){
    function pick(){state.category=c;renderMenus();renderRows();window.scrollTo(0,0)}
    var li=document.createElement('li'),b=document.createElement('button');
    b.type='button';b.textContent=c;b.setAttribute('aria-current',String(c===state.category));
    b.addEventListener('click',pick);li.appendChild(b);nav.appendChild(li);
    var li2=document.createElement('li'),b2=document.createElement('button');
    b2.type='button';b2.setAttribute('aria-current',String(c===state.category));
    b2.innerHTML='<span>'+esc(c)+'</span><span class="n">'+fa(countIn(c))+'</span>';
    b2.addEventListener('click',pick);li2.appendChild(b2);cats.appendChild(li2);
  });
}

function renderRows(){
  var q=state.query.trim().toLowerCase();
  var rows=FILES.filter(function(f){
    if(state.category!==ALL&&f.category!==state.category)return false;
    if(!q)return true;
    return f.title.toLowerCase().indexOf(q)>-1||f.category.toLowerCase().indexOf(q)>-1||f.version.toLowerCase().indexOf(q)>-1;
  });
  $('ttl').textContent=state.category===ALL?'آخرین نرم‌افزارها':state.category;
  $('cnt').textContent=fa(rows.length)+' مورد';
  var ul=$('rows');
  if(!rows.length){ul.innerHTML='<li class="empty">چیزی پیدا نشد.</li>';return}
  ul.innerHTML=rows.map(function(f){
    return '<li class="row"><span class="ic" aria-hidden="true">'+f.icon+'</span>'+
      '<div class="tt"><a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.title)+' <span dir="ltr">'+esc(f.version)+'</span></a>'+
      '<small><span>'+esc(f.category)+'</span><span>حجم: <i dir="ltr">'+esc(f.size)+'</i></span></small></div>'+
      '<a class="dl" href="'+esc(f.url)+'" target="_blank" rel="noopener" title="صفحهٔ رسمی سازنده">دریافت</a></li>';
  }).join('');
}

$('q').addEventListener('input',function(e){state.query=e.target.value;renderRows()});
document.addEventListener('keydown',function(e){
  var t=(document.activeElement&&document.activeElement.tagName)||'';
  if(e.key==='/'&&t!=='INPUT'){e.preventDefault();$('q').focus()}
});
renderMenus();renderRows();
})();
</script>
